<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ledarskapsakuten | Peter Brodd</title>
  <meta name="description" content="Ledarskapsakuten – Interim och chefsstöd med Peter Brodd.">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
      background: #241b14;
      -webkit-font-smoothing: antialiased;
    }

    .hero {
      min-height: 100vh;
      position: relative;
      background-image:
        linear-gradient(
          90deg,
          rgba(18, 13, 9, 0.82) 0%,
          rgba(18, 13, 9, 0.58) 43%,
          rgba(18, 13, 9, 0.12) 75%
        ),
        url("kaffebild.png");
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      width: min(1400px, calc(100% - 80px));
      margin: 0 auto;
      padding: 42px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 30px;
    }

    .brand {
      display: flex;
      align-items: stretch;
      gap: 14px;
    }

    .orange-line {
      width: 7px;
      background: #f26522;
    }

    .brand-name {
      font-size: 31px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.5px;
    }

    .brand-person {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 4px;
    }

    .toplinks {
      display: flex;
      gap: 36px;
      padding-top: 7px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .content {
      width: min(1400px, calc(100% - 80px));
      margin: auto;
      padding-bottom: 100px;
    }

    h1 {
      max-width: 920px;
      margin: 0;
      font-size: clamp(42px, 4.2vw, 70px);
      line-height: 1.12;
      font-weight: 300;
      letter-spacing: -2px;
    }

    .accent {
      color: #f26522;
    }

    .services {
      margin-top: 32px;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 6px;
      text-transform: uppercase;
    }

    .divider {
      color: #f26522;
      margin: 0 22px;
    }

    .buttons {
      display: flex;
      gap: 16px;
      margin-top: 36px;
    }

    .button {
      display: inline-block;
      padding: 18px 30px;
      border-radius: 40px;
      border: 1px solid rgba(255,255,255,.8);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: .2s ease;
    }

    .button-primary {
      background: #f26522;
      border-color: #f26522;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    @media (max-width: 760px) {
      .hero {
        background-position: 42% center;
      }

      .topbar,
      .content {
        width: calc(100% - 40px);
      }

      .topbar {
        padding-top: 25px;
      }

      .toplinks {
        display: none;
      }

      .brand-name {
        font-size: 25px;
      }

      .content {
        margin-top: 70px;
        margin-bottom: 0;
        padding-bottom: 55px;
      }

      h1 {
        font-size: 42px;
        letter-spacing: -1px;
      }

      .services {
        font-size: 13px;
        letter-spacing: 3px;
      }

      .buttons {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <main class="hero">

    <header class="topbar">
      <div class="brand">
        <div class="orange-line"></div>
        <div>
          <div class="brand-name">Ledarskapsakuten</div>
          <div class="brand-person">PETER BRODD</div>
        </div>
      </div>

      <nav class="toplinks">
        <a href="https://www.linkedin.com/in/broddpeter"
           target="_blank" rel="noopener">LinkedIn ↗</a>
        <a href="mailto:info@ledarskapsakuten.se">Kontakt</a>
      </nav>
    </header>

    <section class="content">

      <h1>
        Hjälper bra ledare bli
        <span class="accent">bättre chefer</span><br>
        och bra chefer bli
        <span class="accent">bättre ledare.</span>
      </h1>

      <div class="services">
        Interim <span class="divider">|</span> Chefsstöd
      </div>

      <div class="buttons">
        <a class="button button-primary"
           href="https://www.linkedin.com/in/broddpeter"
           target="_blank" rel="noopener">
          Följ Peter på LinkedIn ↗
        </a>

        <a class="button"
           href="mailto:info@ledarskapsakuten.se">
          Kontakt ↗
        </a>
      </div>

    </section>

  </main>
</body>
</html>
