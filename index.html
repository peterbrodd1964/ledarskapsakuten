<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ledarskapsakuten</title>
  <meta name="description" content="Ledarskapsakuten">
  
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      background: #ffffff;
      color: #111111;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100vh;
      max-width: 1100px;
      margin: 0 auto;
      padding: 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .logo {
      display: block;
      width: min(400px, 75vw);
      height: auto;
      margin-bottom: 65px;
    }

    h1 {
      max-width: 850px;
      margin: 0;
      font-size: clamp(42px, 5vw, 70px);
      line-height: 1.05;
      letter-spacing: -0.04em;
      font-weight: 800;
    }

    .contact {
      margin-top: 45px;
      font-size: 19px;
      line-height: 1.5;
    }

    a {
      color: #111111;
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
    }

    a:hover {
      color: #ff7a00;
    }

    @media (max-width: 700px) {
      .page {
        padding: 30px 24px;
        justify-content: flex-start;
      }

      .logo {
        width: min(350px, 88vw);
        margin-top: 25px;
        margin-bottom: 65px;
      }

      h1 {
        font-size: clamp(38px, 11vw, 54px);
      }

      .contact {
        margin-top: 35px;
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <img
      class="logo"
      src="ledarskapsakuten-logo.png"
      alt="Ledarskapsakuten"
    >

    <h1>
      Hjälper bra ledare bli bättre chefer och bra chefer bli bättre ledare.
    </h1>

    <p class="contact">
      Kontakta via
      <a href="https://www.linkedin.com/in/broddpeter" target="_blank">LinkedIn</a>
      eller
      <a href="mailto:info@ledarskapsakuten.se">info@ledarskapsakuten.se</a>
    </p>

  </main>

</body>
</html>
