<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Ledarskapsakuten | Interim och chefsstöd – Peter Brodd</title>

<meta name="description"
      content="Erfaren hjälp med ledarskapet när den behövs. Interim och chefsstöd med Peter Brodd.">

<style>

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  color: #fff;
  background: #241b14;
  -webkit-font-smoothing: antialiased;
}

a {
  color: inherit;
  text-decoration: none;
}


/* HERO */

.hero {
  min-height: 100vh;
  position: relative;

  background-image:
    linear-gradient(
      90deg,
      rgba(18,13,9,.82) 0%,
      rgba(18,13,9,.58) 43%,
      rgba(18,13,9,.12) 75%
    ),
    url("kaffebild.png");

  background-size: cover;
  background-position: center;

  display: flex;
  flex-direction: column;
}


/* TOP */

.topbar {
  width: min(1400px, calc(100% - 80px));
  margin: 0 auto;
  padding: 42px 0;

  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 30px;
}

.brand {
  display: flex;
  align-items: stretch;
  gap: 14px;
}

.orange-line {
  width: 7px;
  background: #f26522;
}

.brand-name {
  font-size: 31px;
  font-weight: 400;
  line-height: 1;
  letter-spacing: -.5px;
}

.brand-person {
  margin-top: 10px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 4px;
}

.toplinks {
  display: flex;
  gap: 32px;
  padding-top: 7px;

  font-size: 13px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
}


/* CONTENT */

.content {
  width: min(1400px, calc(100% - 80px));
  margin: auto;
  padding-bottom: 180px;
}

h1 {
  max-width: 940px;
  margin: 0;

  font-size: clamp(42px, 4.1vw, 64px);
  line-height: 1.1;
  font-weight: 300;
  letter-spacing: -2px;
}

.accent {
  color: #f26522;
}


/* SERVICES */

.services {
  margin-top: 36px;
}

.service-headings {
  display: flex;
  align-items: center;

  font-size: 17px;
  font-weight: 600;
  letter-spacing: 6px;
  text-transform: uppercase;
}

.divider {
  color: #f26522;
  margin: 0 22px;
}

.situations {
  margin-top: 22px;
  max-width: 620px;

  font-size: 19px;
  line-height: 1.55;
  font-weight: 500;
  color: rgba(255,255,255,.94);
}

.situation-line {
  display: block;
}

.dot {
  color: #f26522;
  font-weight: 700;
  padding: 0 8px;
}


/* CTA */

.button {
  display: inline-block;

  margin-top: 34px;
  padding: 18px 30px;

  border-radius: 40px;
  border: 1px solid #f26522;
  background: #f26522;

  font-size: 13px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;

  transition: .2s ease;
}

.button:hover {
  transform: translateY(-2px);
}


/* MOBILE */

@media(max-width:760px) {

  .hero {
    min-height: 100svh;
    background-position: 54% center;
  }

  .topbar,
  .content {
    width: calc(100% - 32px);
  }

  .topbar {
    padding-top: 22px;
    padding-bottom: 20px;

    flex-direction: column;
    gap: 16px;
  }

  .brand-name {
    font-size: 24px;
  }

  .brand-person {
    font-size: 11px;
    letter-spacing: 3px;
  }

  .toplinks {
    gap: 17px;
    padding-top: 4px;

    font-size: 9px;
    letter-spacing: 1px;

    flex-wrap: wrap;
  }

  .content {
    margin-top: 25px;
    margin-bottom: auto;
    padding-bottom: 38px;
  }

  h1 {
    max-width: 380px;

    font-size: 37px;
    line-height: 1.08;
    letter-spacing: -1px;
  }

  h1 br {
    display: none;
  }

  .services {
    margin-top: 27px;
  }

  .service-headings {
    font-size: 11px;
    letter-spacing: 2.5px;
  }

  .divider {
    margin: 0 12px;
  }

  .situations {
    margin-top: 18px;
    max-width: 340px;

    font-size: 16px;
    line-height: 1.6;
  }

  .dot {
    padding: 0 5px;
  }

  .button {
    margin-top: 27px;
    padding: 15px 22px;

    font-size: 10px;
    letter-spacing: 1.5px;
  }

}

</style>
</head>


<body>

<main class="hero">


  <header class="topbar">

    <a class="brand" href="/">

      <div class="orange-line"></div>

      <div>
        <div class="brand-name">Ledarskapsakuten</div>
        <div class="brand-person">PETER BRODD</div>
      </div>

    </a>


    <nav class="toplinks">

      <a href="/interim/">Interim</a>

      <a href="/chefsstod/">Chefsstöd</a>

      <a href="/om/">Om</a>

      <a href="mailto:info@ledarskapsakuten.se">
        Kontakt
      </a>

    </nav>

  </header>



  <section class="content">

    <h1>
      När du behöver erfaren hjälp med<br>
      ledarskapet – <span class="accent">nu.</span>
    </h1>


    <div class="services">


      <div class="service-headings">

        <a href="/interim/">INTERIM</a>

        <span class="divider">|</span>

        <a href="/chefsstod/">CHEFSSTÖD</a>

      </div>


      <div class="situations">

        <span class="situation-line">
          Förändring<span class="dot">·</span>Vakans<span class="dot">·</span>Tillväxt
        </span>

        <span class="situation-line">Rådgivning<span class="dot">·</span>Bollplank<span class="dot">·</span>Mentorskap</span>

      </div>


      <a class="button"
         href="mailto:info@ledarskapsakuten.se?subject=Ta%20en%20kaffe">
        Ta en kaffe →
      </a>


    </div>

  </section>


</main>

</body>
</html>
